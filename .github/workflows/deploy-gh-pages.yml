name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'privacy_policy/en.md'
      - 'privacy_policy/uk.md'
      - 'privacy_policy/template.html'
      - 'landing/index.html'
      - 'landing/assets/**'
      - '.github/workflows/deploy-gh-pages.yml'
  workflow_dispatch:  # Allows manual trigger

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Pandoc
        uses: pandoc/actions/setup@v1
        with:
          version: 3.1.11

      - name: Create temporary directory
        run: |
          mkdir -p temp_build

      - name: Convert Markdown to HTML
        run: |
          # Convert English version
          pandoc privacy_policy/en.md \
            --from markdown \
            --to html5 \
            --standalone \
            --template=privacy_policy/template.html \
            --metadata title="Privacy Policy" \
            --metadata lang="en" \
            --output=temp_build/privacy-policy.html

          # Convert Ukrainian version
          pandoc privacy_policy/uk.md \
            --from markdown \
            --to html5 \
            --standalone \
            --template=privacy_policy/template.html \
            --metadata title="Політика конфіденційності" \
            --metadata lang="uk" \
            --output=temp_build/privacy-policy-uk.html

      - name: Create privacy policy index redirect
        run: |
          cat > temp_build/privacy-index.html << 'EOF'
          <!DOCTYPE html>
          <html>
          <head>
              <meta charset="UTF-8">
              <meta http-equiv="refresh" content="0; url=privacy-policy.html">
              <title>Redirecting...</title>
          </head>
          <body>
              <p>Redirecting to <a href="privacy-policy.html">Privacy Policy</a>...</p>
          </body>
          </html>
          EOF

      - name: Prepare deployment directory
        run: |
          mkdir -p deploy
          mkdir -p deploy/privacy_policy
          mkdir -p deploy/assets

          # Copy landing page to root
          cp landing/index.html deploy/index.html

          # Copy landing assets
          cp -r landing/assets/* deploy/assets/

          # Copy privacy policy files
          cp temp_build/privacy-policy.html deploy/privacy_policy/
          cp temp_build/privacy-policy-uk.html deploy/privacy_policy/
          cp temp_build/privacy-index.html deploy/privacy_policy/index.html

          # Create .nojekyll to prevent Jekyll processing
          touch deploy/.nojekyll

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./deploy
          publish_branch: gh-pages
          force_orphan: true
          commit_message: |
            Deploy to GitHub Pages

            Last updated: ${{ github.event.head_commit.message }}
            Commit: ${{ github.sha }}
