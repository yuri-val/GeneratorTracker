name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'landing/**'
      - 'release_notes/**'
      - 'app.json'
      - 'privacy_policy/en.md'
      - 'privacy_policy/uk.md'
      - 'privacy_policy/template.html'
      - '.github/workflows/deploy-gh-pages.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Pandoc
        uses: pandoc/actions/setup@v1
        with:
          version: 3.1.11

      - name: Build landing page (EN at /, UK at /uk/)
        run: python3 landing/build.py

      - name: Build privacy policy pages
        run: |
          mkdir -p landing/_site/privacy_policy
          pandoc privacy_policy/en.md --from markdown+lists_without_preceding_blankline --to html5 --standalone \
            --template=privacy_policy/template.html \
            --metadata title="Privacy Policy" --metadata lang="en" \
            --metadata home="../" --metadata file="privacy-policy.html" \
            --metadata description="How Generator Tracker handles your data: local-first storage, optional cloud sync, no ads and no tracking." \
            --output=landing/_site/privacy_policy/privacy-policy.html
          pandoc privacy_policy/uk.md --from markdown+lists_without_preceding_blankline --to html5 --standalone \
            --template=privacy_policy/template.html \
            --metadata title="Політика конфіденційності" --metadata lang="uk" \
            --metadata home="../uk/" --metadata file="privacy-policy-uk.html" \
            --metadata description="Як Generator Tracker поводиться з вашими даними: локальне зберігання, синхронізація за бажанням, без реклами й стеження." \
            --output=landing/_site/privacy_policy/privacy-policy-uk.html
          cat > landing/_site/privacy_policy/index.html << 'EOF'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta http-equiv="refresh" content="0; url=privacy-policy.html">
            <link rel="canonical" href="https://yuri-val.github.io/GeneratorTracker/privacy_policy/privacy-policy.html">
            <title>Privacy Policy — Generator Tracker</title>
          </head>
          <body><p><a href="privacy-policy.html">Privacy Policy</a></p></body>
          </html>
          EOF

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./landing/_site
          publish_branch: gh-pages
          force_orphan: true
          commit_message: |
            Deploy to GitHub Pages

            Last updated: ${{ github.event.head_commit.message }}
            Commit: ${{ github.sha }}
