name: Build Android

on:
  workflow_dispatch:
    inputs:
      build_type:
        type: choice
        description: Build type (Select 'both' for parallel builds)
        options:
          - both
          - apk
          - aab
        default: both
      profile:
        type: choice
        description: Eas Profile (Applied when single type selected. 'both' uses defaults)
        options:
          - preview
          - production
        default: preview

jobs:
  setup:
    name: 🚦 Setup Build Matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - id: set-matrix
        run: |
          if [ "${{ github.event.inputs.build_type }}" == "both" ]; then
            echo 'matrix=["apk", "aab"]' >> $GITHUB_OUTPUT
          else
            echo 'matrix=["${{ github.event.inputs.build_type }}"]' >> $GITHUB_OUTPUT
          fi

  build:
    needs: setup
    name: 👷 Build ${{ matrix.type }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        type: ${{ fromJson(needs.setup.outputs.matrix) }}
    
    env:
      EAS_LOCAL_BUILD_SKIP_WAIT: 1
      EAS_NO_VCS: 1
      # Optimize Gradle memory for CI runners (7GB RAM available)
      GRADLE_OPTS: '-Dorg.gradle.daemon=true -Dorg.gradle.parallel=true -Dorg.gradle.jvmargs="-Xmx3072m -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError"'

    steps:
      - name: 🏗 Checkout repository
        uses: actions/checkout@v4

      - name: 🏗 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 🏗 Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🐘 Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: false

      - name: 🏗 Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔐 Setup Android Credentials
        run: |
          mkdir -p ./credentials/android
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > ./credentials/android/keystore.jks
          
          cat > credentials.json <<EOF
          {
            "android": {
              "keystore": {
                "keystorePath": "./credentials/android/keystore.jks",
                "keystorePassword": "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}",
                "keyAlias": "${{ secrets.ANDROID_KEY_ALIAS }}",
                "keyPassword": "${{ secrets.ANDROID_KEY_PASSWORD }}"
              }
            }
          }
          EOF

      - name: ⚙️ Determine Profile
        id: profile
        run: |
          INPUT_TYPE="${{ github.event.inputs.build_type }}"
          INPUT_PROFILE="${{ github.event.inputs.profile }}"
          CURRENT_TYPE="${{ matrix.type }}"
          
          if [ "$INPUT_TYPE" == "both" ]; then
            if [ "$CURRENT_TYPE" == "apk" ]; then
              echo "profile=preview" >> $GITHUB_OUTPUT
            else
              echo "profile=production" >> $GITHUB_OUTPUT
            fi
          else
            echo "profile=$INPUT_PROFILE" >> $GITHUB_OUTPUT
          fi

      - name: 🚀 Build ${{ matrix.type }}
        run: |
          eas build --local \
            --non-interactive \
            --platform android \
            --profile ${{ steps.profile.outputs.profile }} \
            --output ./build/app-release.${{ matrix.type }}

      - name: 📤 Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-${{ matrix.type }}
          path: ./build/app-release.${{ matrix.type }}
          retention-days: 14

      - name: 📋 Build Summary
        if: always()
        run: |
          echo "## ✅ ${{ matrix.type }} Build Complete" >> $GITHUB_STEP_SUMMARY
          echo "- **Profile:** ${{ steps.profile.outputs.profile }}" >> $GITHUB_STEP_SUMMARY
