# Landing/store screenshots on an Android emulator with seeded demo data (see seed.py).
# Start with the app open on Home: maestro test -e LANG=en -e MAINT=Maintenance -e CHARTS=Charts scripts/demo-data/android-screens.yaml
appId: com.yurival.GeneratorTracker
---
- extendedWaitUntil:
    visible: ".*Honda EU22i.*"
    timeout: 60000
- takeScreenshot: android-${LANG}-home
- tapOn: ".*Honda EU22i.*"
- extendedWaitUntil:
    visible: ".*(Inverter|Інвертор).*"
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: android-${LANG}-active
- tapOn:
    text: "${MAINT} \\(.*"
    retryTapIfNoChange: true
- waitForAnimationToEnd
- takeScreenshot: android-${LANG}-maintenance
- tapOn: "Back"
- tapOn:
    id: tab-analytics
- tapOn: "${CHARTS}"
- waitForAnimationToEnd
- takeScreenshot: android-${LANG}-charts
- tapOn:
    id: tab-home
