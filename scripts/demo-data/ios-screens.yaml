# Landing/store screenshots on an iOS simulator with seeded demo data (see seed.py).
# maestro test -e LANG=en -e ANALYTICS=Analytics -e CHARTS=Charts -e MAINT=Maintenance scripts/demo-data/ios-screens.yaml
appId: com.yuri-val.generatortracker
---
- launchApp
- extendedWaitUntil:
    visible: ".*Honda EU22i.*"
    timeout: 30000
- waitForAnimationToEnd
- takeScreenshot: ios-${LANG}-home
- tapOn: ".*Honda EU22i.*"
- extendedWaitUntil:
    visible: ".*(Inverter|Інвертор).*"
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: ios-${LANG}-active
- tapOn:
    text: "${MAINT} \\(.*"
    retryTapIfNoChange: true
- swipe:
    start: "50%,85%"
    end: "50%,20%"
    duration: 600
- waitForAnimationToEnd
- takeScreenshot: ios-${LANG}-maintenance
- tapOn: "Back"
- tapOn: "${ANALYTICS}"
- tapOn: "${CHARTS}"
- waitForAnimationToEnd
- takeScreenshot: ios-${LANG}-charts
