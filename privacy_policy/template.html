<!DOCTYPE html>
<html lang="$lang$">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>$title$ - Generator Tracker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #FF6B35;
            --primary-dark: #E55A2B;
            --bg-dark: #0D0D0D;
            --bg-card: #1A1A1A;
            --bg-card-hover: #242424;
            --text-primary: #FFFFFF;
            --text-secondary: #9CA3AF;
            --text-muted: #6B7280;
            --border: #2D2D2D;
            --success: #22C55E;
            --info: #0EA5E9;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'IBM Plex Sans', sans-serif;
            background: var(--bg-dark);
            color: var(--text-primary);
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* Noise texture overlay */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
            opacity: 0.03;
            pointer-events: none;
            z-index: 1000;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 0 24px;
        }

        /* Typography */
        h1, h2, h3 {
            font-family: 'Bebas Neue', sans-serif;
            letter-spacing: 0.02em;
            line-height: 1.1;
        }

        /* Navigation */
        nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
            padding: 20px 0;
            background: linear-gradient(to bottom, rgba(13,13,13,0.95), rgba(13,13,13,0));
            backdrop-filter: blur(10px);
        }

        nav .container {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            color: var(--text-primary);
        }

        .logo-icon {
            width: 40px;
            height: 40px;
            background: var(--primary);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logo-icon svg {
            width: 24px;
            height: 24px;
            fill: white;
        }

        .logo-text {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 1.5rem;
            letter-spacing: 0.05em;
        }

        .lang-switch {
            display: flex;
            gap: 12px;
        }

        .lang-switch a {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            padding: 8px 16px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--bg-card);
            transition: all 0.2s;
        }

        .lang-switch a:hover {
            color: var(--primary);
            border-color: var(--primary);
        }

        /* Content */
        .content {
            padding: 120px 0 80px;
        }

        h1 {
            font-size: clamp(2.5rem, 6vw, 4rem);
            margin-bottom: 32px;
            color: var(--text-primary);
        }

        h2 {
            font-size: clamp(1.8rem, 4vw, 2.5rem);
            margin-top: 48px;
            margin-bottom: 24px;
            color: var(--primary);
        }

        h3 {
            font-size: clamp(1.3rem, 3vw, 1.8rem);
            margin-top: 32px;
            margin-bottom: 16px;
            color: var(--text-secondary);
        }

        p {
            margin-bottom: 20px;
            color: var(--text-secondary);
            font-size: 1.05rem;
            line-height: 1.8;
        }

        ul, ol {
            margin-left: 32px;
            margin-bottom: 20px;
            color: var(--text-secondary);
        }

        li {
            margin-bottom: 12px;
            line-height: 1.7;
        }

        strong {
            color: var(--text-primary);
            font-weight: 600;
        }

        a {
            color: var(--primary);
            text-decoration: none;
            transition: color 0.2s;
        }

        a:hover {
            color: var(--primary-dark);
            text-decoration: underline;
        }

        code {
            background: var(--bg-card);
            color: var(--primary);
            padding: 3px 8px;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
            font-size: 0.9em;
            border: 1px solid var(--border);
        }

        hr {
            border: none;
            border-top: 1px solid var(--border);
            margin: 48px 0;
        }

        /* Footer */
        footer {
            margin-top: 80px;
            padding: 40px 0;
            border-top: 1px solid var(--border);
            text-align: center;
        }

        footer p {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        footer a {
            color: var(--text-secondary);
            margin: 0 8px;
        }

        footer a:hover {
            color: var(--primary);
        }

        .last-updated {
            color: var(--text-muted);
            font-style: italic;
            font-size: 0.95rem;
            margin-bottom: 32px;
        }

        /* Mobile responsive */
        @media (max-width: 768px) {
            .container {
                padding: 0 16px;
            }

            .content {
                padding: 100px 0 60px;
            }

            nav .container {
                flex-direction: column;
                gap: 16px;
            }

            .lang-switch {
                width: 100%;
                justify-content: center;
            }

            h1 {
                font-size: 2.5rem;
            }

            h2 {
                font-size: 1.8rem;
            }

            h3 {
                font-size: 1.3rem;
            }
        }
    </style>
</head>
<body>
    <nav>
        <div class="container">
            <a href="/" class="logo">
                <div class="logo-icon">
                    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path d="M13 2L3 14h8l-1 8 10-12h-8l1-8z"/>
                    </svg>
                </div>
                <span class="logo-text">Generator Tracker</span>
            </a>
            <div class="lang-switch">
                <a href="privacy-policy.html">English</a>
                <a href="privacy-policy-uk.html">Українська</a>
            </div>
        </div>
    </nav>

    <div class="content">
        <div class="container">
            $body$

            <footer>
                <p>
                    <a href="/">Home</a> |
                    <a href="https://github.com/yuri-val/GeneratorTracker">GitHub</a> |
                    <a href="mailto:yuri.valigursky@gmail.com">Contact</a>
                </p>
                <p>&copy; 2025-2026 Generator Tracker</p>
            </footer>
        </div>
    </div>
</body>
</html>
