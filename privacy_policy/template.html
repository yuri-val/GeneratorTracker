<!doctype html>
<html lang="$lang$">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>$title$ — Generator Tracker</title>
  <meta name="description" content="$description$">
  <meta name="theme-color" content="#0d0f12">
  <link rel="canonical" href="https://yuri-val.github.io/GeneratorTracker/privacy_policy/$file$">
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <link rel="icon" href="../favicon.png" type="image/png" sizes="64x64">
  <link rel="apple-touch-icon" href="../apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles.css">
  <style>
    .doc { max-width: 760px; padding: clamp(40px, 6vw, 72px) 0 80px; }
    .doc h1 { font-size: clamp(34px, 5vw, 48px); margin-bottom: 12px; }
    .doc h2 { font-size: 26px; margin: 48px 0 14px; padding-top: 24px; border-top: 1px solid var(--line); }
    .doc h3 { font-size: 19px; margin: 28px 0 10px; }
    .doc p, .doc li { color: var(--text-2); }
    .doc p { margin: 12px 0; }
    .doc ul, .doc ol { padding-left: 22px; margin: 10px 0; }
    .doc li + li { margin-top: 6px; }
    .doc strong { color: var(--text); }
    .doc a { color: var(--brand); }
    .doc hr { border: 0; border-top: 1px solid var(--line); margin: 48px 0; }
    .doc code { padding: 2px 6px; border-radius: 6px; background: var(--bg-card); font-size: 0.9em; }
    .doc-langs { display: inline-flex; gap: 8px; }
  </style>
</head>
<body>
  <header class="site-header is-scrolled">
    <div class="container header-inner">
      <a class="brand" href="$home$">
        <img src="../assets/app-icon.png" width="36" height="36" alt="">
        <span>Generator Tracker</span>
      </a>
      <div class="header-actions" style="margin-left:auto">
        <nav class="doc-langs" aria-label="Language">
          <a class="lang-switch" href="privacy-policy.html" hreflang="en" lang="en">EN</a>
          <a class="lang-switch" href="privacy-policy-uk.html" hreflang="uk" lang="uk">UA</a>
        </nav>
      </div>
    </div>
  </header>
  <main class="container doc">
$body$
  </main>
  <footer class="site-footer">
    <div class="container footer-bottom" style="margin-top:0;border-top:0;padding-top:0">
      <p><a href="$home$">Generator Tracker</a> · <a href="https://github.com/yuri-val/GeneratorTracker">GitHub</a> · <a href="mailto:yuri.valigursky@gmail.com">yuri.valigursky@gmail.com</a></p>
      <p style="margin-top:8px">© 2026 Yuri Valigursky · MIT License</p>
    </div>
  </footer>
</body>
</html>
