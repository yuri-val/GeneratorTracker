# Native Android UI flow (Material 3 navigation, Paper forms, system dialogs).
# Run against a dev or release build already open on Home: npm run test:native:android
appId: com.yurival.GeneratorTracker
name: Android core flows
---
- tapOn:
    id: tab-home
# Create a generator (header "+" -> modal form)
- tapOn:
    id: fab-add-generator
- tapOn:
    id: input-generator-name
- runFlow:
    when:
      visible: "Try out your stylus"
    commands:
      - tapOn: "Cancel"
- inputText: Maestro Gen
- tapOn:
    id: save-generator
- assertVisible: ".*Maestro Gen.*"

# Start, stop (no confirmation since 3.0), undo from the snackbar, stop again
- tapOn: ".*Maestro Gen.*"
- tapOn:
    id: start-session
- assertVisible:
    id: stop-session
- tapOn:
    id: stop-session
- tapOn:
    id: snackbar-action # "Cancel" = undo: the session runs again
- tapOn:
    id: stop-session
- assertVisible: "Sessions \\(1\\)"

# Add a refill
- tapOn:
    text: "Refills \\(.*"
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible: "Add Refill"
    timeout: 15000
- tapOn: "Add Refill"
- tapOn:
    id: input-refill-amount
- inputText: "4.5"
- tapOn:
    id: save-refill # 3.0 refill sheet: "Save 4.5 L" at the bottom
- assertVisible: "Refills \\(1\\)"

# Add a maintenance task
- tapOn:
    text: "Maintenance \\(.*"
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible: "Add Maintenance Task"
    timeout: 15000
- tapOn: "Add Maintenance Task"
- tapOn:
    id: input-maintenance-title
- inputText: Oil change
- tapOn:
    id: input-maintenance-hours
- inputText: "100"
- tapOn:
    id: save-maintenance
- assertVisible: ".*Oil change.*"

# Delete the generator (top app bar action -> Material alert dialog)
- tapOn:
    id: detail-delete-generator
- tapOn: "Delete"
- assertVisible: "Generators" # Home title since 3.0 (no "deleted" alert any more)
- assertNotVisible: ".*Maestro Gen.*"
