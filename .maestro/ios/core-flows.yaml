# Native iOS UI flow (SwiftUI forms, native bars, UIAlertController).
# Run against a dev or release build already open on Home: npm run test:native:ios
appId: com.yuri-val.generatortracker
name: iOS core flows
---
- tapOn: "Home" # bottom (iPhone) or top (iPad) tab bar
# Create a generator (nav-bar "+" -> SwiftUI form sheet)
- tapOn: "New Generator"
- tapOn:
    id: input-generator-name
- inputText: Maestro Gen
- tapOn:
    id: input-generator-model
- inputText: EU22i
- tapOn: "Save"
- assertVisible: ".*Maestro Gen.*"

# Start, stop (no confirmation since 3.0), undo from the snackbar, stop again
- tapOn: ".*Maestro Gen.*"
- tapOn:
    id: start-session
- assertVisible:
    id: stop-session
- tapOn:
    id: stop-session
- tapOn:
    id: snackbar-action # "Cancel" = undo: the session runs again
- tapOn:
    id: stop-session
- assertVisible: "Sessions \\(1\\)"

# Add a refill through the native form
- tapOn:
    text: "Refills \\(.*"
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible: "Add Refill"
    timeout: 15000
- tapOn: "Add Refill"
- tapOn:
    id: input-refill-amount
- inputText: "4.5"
- tapOn:
    id: save-refill # 3.0 refill sheet: "Save 4.5 L" at the bottom
- assertVisible: "Refills \\(1\\)"

# Add a maintenance task
- tapOn:
    text: "Maintenance \\(.*"
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible: "Add Maintenance Task"
    timeout: 15000
- tapOn: "Add Maintenance Task"
- tapOn:
    id: input-maintenance-title
- inputText: Oil change
- tapOn:
    id: input-maintenance-hours
- inputText: "100"
- tapOn: "Save"
- assertVisible: ".*Oil change.*"

# Delete the generator via the "More" menu and the destructive alert
- tapOn: "More"
- tapOn: "Delete"
- tapOn: "Delete" # the alert's destructive action
- assertVisible: "Generators" # Home title since 3.0 (no "deleted" alert any more)
- assertNotVisible: ".*Maestro Gen.*"
