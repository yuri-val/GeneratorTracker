services:
  expo:
    image: expo_builder
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile
      platforms:
        - linux/amd64
    container_name: expo_builder
    mem_limit: 16g
    mem_reservation: 8g
    cpus: 6
    shm_size: 4g
    volumes:
      - .:/app/GeneratorTracker
      - gradle-cache:/root/.gradle
      - android-sdk-cache:/opt/android-sdk
    working_dir: /app/GeneratorTracker
    stdin_open: true
    tty: true
    command: /bin/bash

volumes:
  gradle-cache:
  android-sdk-cache:
